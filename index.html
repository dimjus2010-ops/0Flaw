<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plume - Atelier de Rédaction & Correcteur</title>
    <!-- Tailwind CSS pour les styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel pour interpréter le JSX en direct -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Configuration des typographies et couleurs Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fcf8f6',
                            100: '#f7f0eb',
                            200: '#efe0d6',
                            300: '#e3c8b5',
                            500: '#c88a65',
                            600: '#b8734c',
                            700: '#99583a',
                            900: '#4a291a',
                        },
                        editorial: {
                            bg: '#fbf9f6',
                            card: '#ffffff',
                            text: '#2c2a29',
                            muted: '#736d6b',
                            accent: '#635348'
                        }
                    },
                    fontFamily: {
                        serif: ['Georgia', 'Cambria', 'serif'],
                        sans: ['Inter', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fbf9f6;
            color: #2c2a29;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .serif-title {
            font-family: 'Georgia', 'Cambria', serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1ede9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d4c5b9;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Dictionnaire de règles déterministes pour la correction locale
        const CORRECTION_RULES = [
            {
                pattern: /\bsa va\b/gi,
                replacement: "ça va",
                category: "Orthographe",
                explanation: "Utilisation du pronom démonstratif 'ça' au lieu du possessif 'sa'."
            },
            {
                pattern: /\bje pense que sa\b/gi,
                replacement: "je pense que ça",
                category: "Grammaire",
                explanation: "L'adjectif possessif 'sa' doit être remplacé par le démonstratif 'ça'."
            },
            {
                pattern: /\bles personne\b/gi,
                replacement: "les personnes",
                category: "Accord Pluriel",
                explanation: "L'adjectif/substantif au pluriel prend un 's'."
            },
            {
                pattern: /\bbeaucoup de chose\b/gi,
                replacement: "beaucoup de choses",
                category: "Accord Pluriel",
                explanation: "L'expression 'beaucoup de' nécessite le pluriel."
            },
            {
                pattern: /\bse probleme\b/gi,
                replacement: "ce problème",
                category: "Orthographe",
                explanation: "'Ce' est un démonstratif, 'se' est un pronom réfléchi."
            },
            {
                pattern: /\bparce que il\b/gi,
                replacement: "parce qu'il",
                category: "Élision",
                explanation: "L'élision est requise devant une voyelle."
            },
            {
                pattern: /\bmalgré que\b/gi,
                replacement: "bien que",
                category: "Style & Syntaxe",
                explanation: "'Malgré que' est considéré comme incorrect (sauf avec le verbe avoir au subjonctif). Référez 'bien que'."
            },
            {
                pattern: /\bau jour d'aujourd'hui\b/gi,
                replacement: "aujourd'hui",
                category: "Pléonasme",
                explanation: "Redondance stylistique à éviter dans une rédaction soignée."
            }
        ];

        // Exemple de texte initial
        const TEXTE_EXEMPLE = "Bonjour, je pense que sa va intéresser les personne qui cherchent à améliorer leur écriture. Il y a beaucoup de chose à revoir parce que il reste des fautes au jour d'aujourd'hui.";

        function App() {
            // États de l'application
            const [text, setText] = useState(TEXTE_EXEMPLE);
            const [showModalValidation, setShowModalValidation] = useState(false);
            const [showModalPricing, setShowModalPricing] = useState(false);
            const [correctionsDetected, setCorrectionsDetected] = useState([]);
            const [selectedSuggestions, setSelectedSuggestions] = useState({});
            const [isAnalyzed, setIsAnalyzed] = useState(false);
            const [toastMessage, setToastMessage] = useState("");
            const [isPremium, setIsPremium] = useState(false);

            // Suggestions contextuelles optionnelles
            const suggestionsOptions = [
                { id: "s1", label: "Ajouter une phrase de conclusion engageante", text: " N'hésitez pas à nous faire part de vos retours pour peaufiner la suite !" },
                { id: "s2", label: "Insérer une formule de politesse formelle", text: " En vous souhaitant une excellente réception." },
                { id: "s3", label: "Proposer un appel à l'action clair", text: " Prenez rendez-vous dès maintenant pour échanger avec notre équipe." }
            ];

            // Compteur de mots
            const wordCount = useMemo(() => {
                const trimmed = text.trim();
                return trimmed ? trimmed.split(/\s+/).length : 0;
            }, [text]);

            // Seuil de mots pour essai
            const MAX_FREE_WORDS = 399;

            // Notification Toast
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(""), 3000);
            };

            // Analyse du texte via expressions régulières (traitement 100% local)
            const handleAnalyze = () => {
                if (!text.trim()) {
                    showToast("Veuillez saisir du texte à analyser.");
                    return;
                }

                let found = [];
                CORRECTION_RULES.forEach((rule) => {
                    let match;
                    // Réinitialiser la regex
                    const regex = new RegExp(rule.pattern.source, rule.pattern.flags);
                    while ((match = regex.exec(text)) !== null) {
                        found.push({
                            original: match[0],
                            replacement: rule.replacement,
                            category: rule.category,
                            explanation: rule.explanation,
                            index: match.index
                        });
                    }
                });

                setCorrectionsDetected(found);
                setShowModalValidation(true);
            };

            // Validation des corrections et application
            const handleApplyCorrections = () => {
                let textCorrige = text;

                // Application des corrections détectées
                CORRECTION_RULES.forEach((rule) => {
                    textCorrige = textCorrige.replace(rule.pattern, rule.replacement);
                });

                // Ajout des suggestions sélectionnées
                Object.keys(selectedSuggestions).forEach((key) => {
                    if (selectedSuggestions[key]) {
                        const sug = suggestionsOptions.find(s => s.id === key);
                        if (sug) textCorrige += sug.text;
                    }
                });

                setText(textCorrige);
                setShowModalValidation(false);
                setIsAnalyzed(true);
                showToast("Corrections et suggestions appliquées avec succès !");
            };

            // Copier dans le presse-papier
            const handleCopy = (content) => {
                navigator.clipboard.writeText(content).then(() => {
                    showToast("Texte copié dans le presse-papier !");
                }).catch(() => {
                    // Alternative pour la compatibilité iFrame
                    const textArea = document.createElement("textarea");
                    textArea.value = content;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                    showToast("Texte copié !");
                });
            };

            // Basculer une option de suggestion
            const toggleSuggestion = (id) => {
                setSelectedSuggestions(prev => ({ ...prev, [id]: !prev[id] }));
            };

            // Variantes de style générées à partir du texte corrigé
            const variantePro = useMemo(() => {
                if (!isAnalyzed) return "";
                return text
                    .replace(/Bonjour/i, "Madame, Monsieur,")
                    .replace(/N'hésitez pas/i, "Nous vous invitons à") + " Nous demeurons à votre entière disposition pour tout renseignement complémentaire.";
            }, [text, isAnalyzed]);

            const varianteEngageante = useMemo(() => {
                if (!isAnalyzed) return "";
                return "✨ " + text + " 🚀 Qu'en pensez-vous ? Laissez-nous vos impressions en commentaire !";
            }, [text, isAnalyzed]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            return (
                <div className="flex-1 flex flex-col min-h-screen bg-[#fbf9f6] text-[#2c2a29]">
                    {/* EN-TÊTE DE L'APPLICATION */}
                    <header className="border-b border-[#efe0d6] bg-white sticky top-0 z-30 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-brand-100 rounded-lg text-brand-700">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="serif-title text-2xl font-bold text-brand-900 tracking-tight">Plume</h1>
                                        <span className="text-xs bg-brand-100 text-brand-700 font-semibold px-2.5 py-0.5 rounded-full border border-brand-200">
                                            {isPremium ? "Premium Activated" : "Démonstration interactive"}
                                        </span>
                                    </div>
                                    <p className="text-xs text-editorial-muted">Atelier de rédaction & correction stylistique</p>
                                </div>
                            </div>

                            <button 
                                onClick={() => setShowModalPricing(true)}
                                className="w-full sm:w-auto px-5 py-2.5 bg-brand-900 hover:bg-brand-700 text-white font-medium text-sm rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm"
                            >
                                <svg className="w-4 h-4 text-brand-300" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                Offre Premium
                            </button>
                        </div>
                    </header>

                    {/* CONTENU PRINCIPAL */}
                    <main className="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8 flex flex-col gap-8">
                        
                        {/* INDICATEUR DE PROCESSUS EN 3 ÉTAPES */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white p-4 rounded-xl border border-[#efe0d6] flex items-center gap-3">
                                <span className="w-8 h-8 rounded-full bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-sm">01</span>
                                <div>
                                    <h3 className="font-semibold text-sm text-brand-900">Écrivez ou collez</h3>
                                    <p className="text-xs text-editorial-muted">Saisissez votre texte brut dans l'éditeur</p>
                                </div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-[#efe0d6] flex items-center gap-3">
                                <span className="w-8 h-8 rounded-full bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-sm">02</span>
                                <div>
                                    <h3 className="font-semibold text-sm text-brand-900">Validez les fautes</h3>
                                    <p className="text-xs text-editorial-muted">Vérification locale déterministe immédiate</p>
                                </div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-[#efe0d6] flex items-center gap-3">
                                <span className="w-8 h-8 rounded-full bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-sm">03</span>
                                <div>
                                    <h3 className="font-semibold text-sm text-brand-900">Affinez & Copiez</h3>
                                    <p className="text-xs text-editorial-muted">Obtenez des variantes et adaptez le style</p>
                                </div>
                            </div>
                        </div>

                        {/* ZONE D'ÉDITION */}
                        <div className="bg-white rounded-2xl border border-[#efe0d6] shadow-sm flex flex-col overflow-hidden">
                            <div className="p-4 bg-brand-50/50 border-b border-[#efe0d6] flex flex-wrap items-center justify-between gap-3">
                                <span className="text-xs font-semibold uppercase tracking-wider text-brand-700">Zone de rédaction</span>
                                
                                <div className="flex items-center gap-4 text-xs text-editorial-muted">
                                    <span className={`font-medium ${wordCount > MAX_FREE_WORDS ? 'text-red-600 font-bold' : ''}`}>
                                        {wordCount} / {MAX_FREE_WORDS} mots gratuits
                                    </span>
                                    <div className="w-24 bg-gray-200 h-2 rounded-full overflow-hidden">
                                        <div 
                                            className={`h-full ${wordCount > MAX_FREE_WORDS ? 'bg-red-500' : 'bg-brand-600'}`}
                                            style={{ width: `${Math.min((wordCount / MAX_FREE_WORDS) * 100, 100)}%` }}
                                        ></div>
                                    </div>
                                </div>
                            </div>

                            <textarea
                                value={text}
                                onChange={(e) => {
                                    setText(e.target.value);
                                    setIsAnalyzed(false);
                                }}
                                placeholder="Tapez ou collez votre texte en français ici..."
                                className="w-full h-64 p-6 resize-y focus:outline-none text-base leading-relaxed text-editorial-text custom-scrollbar"
                            />

                            {/* BARRE D'ACTIONS EN BAS DU TEXTAREA */}
                            <div className="p-4 border-t border-[#efe0d6] bg-brand-50/30 flex flex-wrap items-center justify-between gap-3">
                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => { setText(""); setIsAnalyzed(false); }}
                                        className="px-3 py-1.5 text-xs text-editorial-muted hover:text-brand-900 border border-gray-200 hover:border-gray-300 rounded-lg bg-white transition-colors"
                                    >
                                        Effacer
                                    </button>
                                    <button
                                        onClick={() => { setText(TEXTE_EXEMPLE); setIsAnalyzed(false); }}
                                        className="px-3 py-1.5 text-xs text-brand-700 hover:text-brand-900 border border-brand-200 rounded-lg bg-brand-50 transition-colors"
                                    >
                                        Charger un exemple
                                    </button>
                                </div>

                                <button
                                    onClick={handleAnalyze}
                                    className="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm rounded-lg shadow-sm transition-all flex items-center gap-2"
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    Analyser mon texte
                                </button>
                            </div>
                        </div>

                        {/* RÉSULTATS ET VARIANTES (AFFICHIÉS APRÈS VALIDATION) */}
                        {isAnalyzed && (
                            <div className="flex flex-col gap-6 animate-fade-in">
                                <div className="flex items-center justify-between border-b border-[#efe0d6] pb-2">
                                    <h2 className="serif-title text-xl font-bold text-brand-900">Résultat & Recommandations de style</h2>
                                    <span className="text-xs bg-green-100 text-green-800 font-medium px-2.5 py-1 rounded-full">Analyse effectuée</span>
                                </div>

                                {/* TEXTE CORRIGÉ ET ENRICHI */}
                                <div className="bg-white p-6 rounded-2xl border border-[#efe0d6] shadow-sm flex flex-col gap-3">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-sm font-semibold text-brand-900 uppercase tracking-wider">Texte corrigé & validé</h3>
                                        <button
                                            onClick={() => handleCopy(text)}
                                            className="px-3 py-1 text-xs bg-brand-100 text-brand-800 hover:bg-brand-200 font-medium rounded-md transition-colors flex items-center gap-1"
                                        >
                                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                            Copier
                                        </button>
                                    </div>
                                    <div className="p-4 bg-brand-50/50 rounded-xl text-editorial-text leading-relaxed font-sans">
                                        {text}
                                    </div>
                                </div>

                                {/* VARIANTES DE REÉCRITURE */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Style Professionnel */}
                                    <div className="bg-white p-6 rounded-2xl border border-[#efe0d6] shadow-sm flex flex-col justify-between gap-4">
                                        <div className="flex flex-col gap-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-semibold uppercase tracking-wider text-blue-700 bg-blue-50 px-2.5 py-1 rounded-full">Style Professionnel</span>
                                                <button 
                                                    onClick={() => handleCopy(variantePro)}
                                                    className="text-xs text-editorial-muted hover:text-brand-900 flex items-center gap-1"
                                                >
                                                    Copier
                                                </button>
                                            </div>
                                            <p className="text-sm text-editorial-text leading-relaxed mt-2 italic">
                                                "{variantePro}"
                                            </p>
                                        </div>
                                        <p className="text-xs text-editorial-muted border-t border-gray-100 pt-3">
                                            Adapté pour un courriel formel, un document administratif ou une communication client.
                                        </p>
                                    </div>

                                    {/* Style Engageant */}
                                    <div className="bg-white p-6 rounded-2xl border border-[#efe0d6] shadow-sm flex flex-col justify-between gap-4">
                                        <div className="flex flex-col gap-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-semibold uppercase tracking-wider text-purple-700 bg-purple-50 px-2.5 py-1 rounded-full">Style Engageant</span>
                                                <button 
                                                    onClick={() => handleCopy(varianteEngageante)}
                                                    className="text-xs text-editorial-muted hover:text-brand-900 flex items-center gap-1"
                                                >
                                                    Copier
                                                </button>
                                            </div>
                                            <p className="text-sm text-editorial-text leading-relaxed mt-2 italic">
                                                "{varianteEngageante}"
                                            </p>
                                        </div>
                                        <p className="text-xs text-editorial-muted border-t border-gray-100 pt-3">
                                            Idéal pour les réseaux sociaux, publications de blog ou newsletters interactives.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* GARANTIE DE CONFIDENTIALITÉ */}
                        <div className="mt-8 p-4 bg-brand-100/40 rounded-xl border border-brand-200 flex items-center gap-3 text-xs text-brand-900">
                            <svg className="w-5 h-5 text-brand-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            <span>
                                <strong>Confidentialité garantie :</strong> Vos données et vos écrits restent 100% locaux. Aucun texte n'est envoyé vers un serveur externe ni stocké en ligne.
                            </span>
                        </div>
                    </main>

                    {/* MODAL DE VALIDATION DES CORRECTIONS */}
                    {showModalValidation && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-xl overflow-hidden border border-[#efe0d6]">
                                <div className="p-6 border-b border-[#efe0d6] flex items-center justify-between bg-brand-50">
                                    <div>
                                        <h3 className="serif-title text-lg font-bold text-brand-900">Approbation des corrections</h3>
                                        <p className="text-xs text-editorial-muted">Synthèse de l'analyse automatique et options de contenu</p>
                                    </div>
                                    <button 
                                        onClick={() => setShowModalValidation(false)}
                                        className="text-gray-400 hover:text-gray-600 rounded-lg p-1"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="p-6 overflow-y-auto flex flex-col gap-6 custom-scrollbar">
                                    {/* LISTE DES FAUTES DÉTECTÉES */}
                                    <div>
                                        <h4 className="text-xs font-semibold text-brand-700 uppercase tracking-wider mb-3">
                                            Fautes & améliorations détectées ({correctionsDetected.length})
                                        </h4>
                                        
                                        {correctionsDetected.length === 0 ? (
                                            <div className="p-4 bg-green-50 text-green-800 text-sm rounded-lg border border-green-200">
                                                Aucune faute courante n'a été identifiée. Votre texte semble prêt !
                                            </div>
                                        ) : (
                                            <div className="border border-gray-100 rounded-xl overflow-hidden">
                                                <table className="w-full text-left text-xs">
                                                    <thead className="bg-gray-50 border-b border-gray-100 text-gray-500">
                                                        <tr>
                                                            <th className="p-3">Erreur</th>
                                                            <th className="p-3">Correction</th>
                                                            <th className="p-3">Règle & Explication</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-gray-100">
                                                        {correctionsDetected.map((corr, idx) => (
                                                            <tr key={idx} className="hover:bg-brand-50/30">
                                                                <td className="p-3 font-semibold text-red-600 line-through">{corr.original}</td>
                                                                <td className="p-3 font-semibold text-green-700">{corr.replacement}</td>
                                                                <td className="p-3 text-editorial-muted">
                                                                    <span className="inline-block bg-brand-100 text-brand-800 font-medium text-[10px] px-1.5 py-0.5 rounded mr-1">
                                                                        {corr.category}
                                                                    </span>
                                                                    {corr.explanation}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>

                                    {/* PROPOSITIONS D'AJOUTS À COCHER */}
                                    <div>
                                        <h4 className="text-xs font-semibold text-brand-700 uppercase tracking-wider mb-3">
                                            Enrichir votre texte (Options)
                                        </h4>
                                        <div className="flex flex-col gap-2">
                                            {suggestionsOptions.map((sug) => (
                                                <label 
                                                    key={sug.id} 
                                                    className="flex items-start gap-3 p-3 rounded-lg border border-gray-100 hover:border-brand-200 bg-brand-50/20 cursor-pointer transition-colors"
                                                >
                                                    <input 
                                                        type="checkbox"
                                                        checked={!!selectedSuggestions[sug.id]}
                                                        onChange={() => toggleSuggestion(sug.id)}
                                                        className="mt-0.5 text-brand-600 focus:ring-brand-500 rounded"
                                                    />
                                                    <div>
                                                        <div className="text-xs font-medium text-brand-900">{sug.label}</div>
                                                        <div className="text-xs text-editorial-muted italic">"{sug.text.trim()}"</div>
                                                    </div>
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="p-4 border-t border-[#efe0d6] bg-brand-50/50 flex justify-end gap-3">
                                    <button
                                        onClick={() => setShowModalValidation(false)}
                                        className="px-4 py-2 text-xs font-medium text-editorial-muted hover:text-brand-900"
                                    >
                                        Annuler
                                    </button>
                                    <button
                                        onClick={handleApplyCorrections}
                                        className="px-5 py-2 bg-brand-900 hover:bg-brand-700 text-white font-medium text-xs rounded-lg transition-colors"
                                    >
                                        Appliquer & Voir le rendu
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL OFFRE PREMIUM / TARIFS */}
                    {showModalPricing && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-[#efe0d6] relative flex flex-col gap-6">
                                <button 
                                    onClick={() => setShowModalPricing(false)}
                                    className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 rounded-lg p-1"
                                >
                                    ✕
                                </button>

                                <div className="text-center">
                                    <span className="text-xs font-bold uppercase tracking-widest text-brand-600 bg-brand-100 px-3 py-1 rounded-full">
                                        Passez au niveau supérieur
                                    </span>
                                    <h3 className="serif-title text-2xl font-bold text-brand-900 mt-2">Abonnement Plume Premium</h3>
                                    <p className="text-xs text-editorial-muted mt-1">Libérez tout le potentiel de votre écriture</p>
                                </div>

                                <div className="bg-brand-50 p-6 rounded-xl border border-brand-200 text-center flex flex-col gap-2">
                                    <div className="text-3xl font-extrabold text-brand-900">
                                        14,99 $ <span className="text-sm font-normal text-editorial-muted">/ premier mois</span>
                                    </div>
                                    <p className="text-xs text-brand-700">Puis réductions progressives pour les abonnés fidèles.</p>
                                </div>

                                <ul className="space-y-3 text-xs text-editorial-text">
                                    <li className="flex items-center gap-2">
                                        <svg className="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                        Correction illimitée sans restriction de nombre de mots
                                    </li>
                                    <li className="flex items-center gap-2">
                                        <svg className="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                        Plus de 15 registres de reformulation stylistique
                                    </li>
                                    <li className="flex items-center gap-2">
                                        <svg className="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                        Export vers PDF, Word et Markdown en un clic
                                    </li>
                                </ul>

                                <button
                                    onClick={() => {
                                        setIsPremium(true);
                                        setShowModalPricing(false);
                                        showToast("Mode Premium activé en simulation !");
                                    }}
                                    className="w-full py-3 bg-brand-900 hover:bg-brand-700 text-white font-medium text-sm rounded-lg transition-colors shadow-md"
                                >
                                    Simuler le déblocage Premium
                                </button>
                            </div>
                        </div>
                    )}

                    {/* TOAST DE NOTIFICATION */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-brand-900 text-white text-xs px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 animate-bounce">
                            <svg className="w-4 h-4 text-brand-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            {toastMessage}
                        </div>
                    )}

                    {/* PIED DE PAGE */}
                    <footer className="border-t border-[#efe0d6] bg-white py-6 text-center text-xs text-editorial-muted mt-auto">
                        <p>© 2026 Plume Atelier - Tous droits réservés. Outil autonome 100% exécuté localement dans votre navigateur.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
